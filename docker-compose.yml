services:
  db:
    image: postgres:15
    container_name: cafe_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
      - ./db/reports_vw.sql:/docker-entrypoint-initdb.d/3_views.sql
      - ./db/indexes.sql:/docker-entrypoint-initdb.d/4_indexes.sql
      - ./db/roles.sql:/docker-entrypoint-initdb.d/5_roles.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cafe_web
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: app_user
      DB_PASSWORD: apppass  
      DB_NAME: postgres
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: